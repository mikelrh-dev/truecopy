# Local-only infrastructure for the plant RAG system (ADR-002).
#
#   Start:     docker compose up -d
#   Readiness: GET http://127.0.0.1:6333/readyz   (the healthcheck below polls it)
#   Stop:      docker compose down                (add -v to discard indexed data)
services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    ports:
      # Bound to LOOPBACK: only this host (the Streamlit app and the CLIs)
      # talks to Qdrant. It ships with NO authentication, so publishing it on
      # the LAN would let any host read or delete the whole corpus regardless
      # of the app login. Operators reach the app (Streamlit), never Qdrant.
      - "127.0.0.1:6333:6333" # REST
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      # Collection data persists across restarts. Dense vectors are created
      # with on_disk=True by retrieve/store.py (Phase 3), so the storage has to
      # live outside the container's writable layer.
      #
      # NAMED VOLUME - NOT a host bind mount. Measured 2026-10-11: with
      # ``./qdrant_data:/qdrant/storage`` EVERY vector in every collection came
      # back all-zero after ``docker compose stop && up``, while points and
      # payloads survived. So counts stayed right, the text branch stayed
      # alive, nothing logged an error and the container reported a clean
      # "Recovered ... 100%" - but the dense branch was dead, the pool floor
      # emptied the pool and every question got the exact refusal (it had
      # already killed revisions r8 and r10 that way). The identical
      # experiment on a named volume survives the restart with identical
      # scores. Do NOT switch this back to a bind mount.
      #
      # Back it up with:
      #   docker run --rm -v ragproyect_qdrant_data:/d -v "$PWD":/b \
      #     alpine tar czf /b/qdrant-backup.tgz -C /d .
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships no curl/wget: probe /readyz over raw bash /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # Owned by Docker, not by the repo working tree: see the volumes comment in
  # the service above for why this is not a bind mount any more.
  qdrant_data:
